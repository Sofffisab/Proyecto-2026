<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="SeleccionarEjercicio.css">
    <title>Document</title>
</head>


<body>
    <div class="header">
       <img class="a" src="file:///C:/Users/49550709/Documents/GitHub/Proyecto-2026/Frontend/src/assets/basil_caret-left-outline.png" alt="">
       <h1>Seleccionar ejercicio</h1>
    </div>
       <div class="input-container">
        <input class="input" id="tituloInput" type="text" maxlength="40" placeholder="Buscar ejercicio">
<img src="file:///C:/Users/49550709/Documents/GitHub/Proyecto-2026/Frontend/src/assets/basil_search-outline.png" alt="">
       
    </div>

    <div class="Ebuton">
         <button>Todos</button>
        <button>Pecho</button>
        <button>Triceps</button>
     <button>Favoritos</button>
    </div>

    <div class="entrenamiento">
           <div class="dia">
            <img src="file:///C:/Users/49550709/Documents/GitHub/Proyecto-2026/Frontend/src/assets/pequeño.png" alt="">
             <h1 class="Edia">Press banca declinada</h1>
             <h1 class="dias"></h1>
    </div>


   <script>
    const botones = document.querySelectorAll(".Ebuton button");

    botones.forEach(boton => {
        boton.addEventListener("click", () => {

            botones.forEach(b => {
                b.classList.remove("seleccionado");
            });

            boton.classList.add("seleccionado");
        });
    });
</script>

</body>
</html>
