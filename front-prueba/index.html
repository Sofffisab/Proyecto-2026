<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba Login / Recuperar contraseña</title>
<style>
  body { font-family: Arial, sans-serif; background:#f2f2f2; display:flex; justify-content:center; padding-top:40px; }
  .card { background:#fff; padding:30px; border-radius:10px; width:360px; box-shadow:0 2px 8px rgba(0,0,0,0.15); }
  h2 { text-align:center; margin-top:0; }
  input { width:100%; padding:10px; margin:6px 0; box-sizing:border-box; border:1px solid #ccc; border-radius:6px; }
  button { width:100%; padding:10px; margin-top:8px; border:none; border-radius:6px; background:#2d6cdf; color:#fff; cursor:pointer; font-size:15px; }
  button:hover { background:#1e54b8; }
  button.secondary { background:#888; }
  button.secondary:hover { background:#666; }
  .tabs { display:flex; margin-bottom:15px; }
  .tabs div { flex:1; text-align:center; padding:8px; cursor:pointer; border-bottom:3px solid #ddd; }
  .tabs div.active { border-bottom:3px solid #2d6cdf; font-weight:bold; }
  .hidden { display:none; }
  .error { color:#c0392b; font-size:13px; margin-top:5px; min-height:16px; }
  .step { display:none; }
  .step.active { display:block; }
</style>
</head>
<body>

<div class="card">
  <h2>Gimnasio - Prueba Auth</h2>
  <div class="tabs">
    <div id="tabLogin" class="active" onclick="showTab('login')">Iniciar sesión</div>
    <div id="tabRecover" onclick="showTab('recover')">Recuperar contraseña</div>
  </div>

  <!-- LOGIN -->
  <div id="loginPanel">
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="Contraseña" autocomplete="current-password">
    <button onclick="login()">Entrar</button>
    <div class="error" id="loginError"></div>
  </div>

  <!-- RECOVER -->
  <div id="recoverPanel" class="hidden">

    <div id="stepEmail" class="step active">
      <input type="email" id="recoverEmail" placeholder="Email">
      <button onclick="forgotPassword()">Enviar código</button>
      <div class="error" id="stepEmailError"></div>
    </div>

    <div id="stepCode" class="step">
      <input type="text" id="resetCode" placeholder="Código de 6 dígitos" maxlength="6">
      <button onclick="verifyCode()">Verificar código</button>
      <button class="secondary" onclick="backTo('stepEmail')">Volver</button>
      <div class="error" id="stepCodeError"></div>
    </div>

    <div id="stepNewPassword" class="step">
      <input type="password" id="newPassword" placeholder="Nueva contraseña (mín. 8 caracteres)">
      <button onclick="resetPassword()">Cambiar contraseña</button>
      <button class="secondary" onclick="backTo('stepCode')">Volver</button>
      <div class="error" id="stepNewPasswordError"></div>
    </div>

  </div>
</div>

<script>
const API_URL = "http://localhost:3000/api/v1";
let recoverEmailValue = "";
let recoverCodeValue = "";

function showTab(tab) {
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabRecover').classList.toggle('active', tab === 'recover');
  document.getElementById('loginPanel').classList.toggle('hidden', tab !== 'login');
  document.getElementById('recoverPanel').classList.toggle('hidden', tab !== 'recover');
}

function backTo(stepId) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(stepId).classList.add('active');
}

function setError(id, msg) {
  document.getElementById(id).innerText = msg || "";
}

async function login() {
  setError('loginError', '');
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  if (!email || !password) {
    setError('loginError', 'Completá email y contraseña.');
    return;
  }

  try {
    const res = await fetch(`${API_URL}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!res.ok || !data.success) {
      setError('loginError', data.message || "Credenciales inválidas.");
      return;
    }

    const { user, accessToken, refreshToken } = data.data;

    // Guardamos en localStorage para simular una sesión real
    localStorage.setItem("accessToken", accessToken);
    localStorage.setItem("refreshToken", refreshToken);
    localStorage.setItem("user", JSON.stringify(user));

    // Redirige a la pantalla de sesión
    window.location.href = "session.html";

  } catch (err) {
    setError('loginError', "No se pudo conectar al backend (" + err.message + ")");
  }
}

async function forgotPassword() {
  setError('stepEmailError', '');
  const email = document.getElementById('recoverEmail').value.trim();
  if (!email) {
    setError('stepEmailError', 'Ingresá un email.');
    return;
  }

  try {
    const res = await fetch(`${API_URL}/auth/forgot-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });
    const data = await res.json();

    if (!res.ok || !data.success) {
      setError('stepEmailError', data.message || "Error al solicitar el código.");
      return;
    }

    recoverEmailValue = email;
    backTo('stepCode');

  } catch (err) {
    setError('stepEmailError', "No se pudo conectar al backend (" + err.message + ")");
  }
}

async function verifyCode() {
  setError('stepCodeError', '');
  const code = document.getElementById('resetCode').value.trim();
  if (!code) {
    setError('stepCodeError', 'Ingresá el código.');
    return;
  }

  try {
    const res = await fetch(`${API_URL}/auth/verify-reset-code`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: recoverEmailValue, code })
    });
    const data = await res.json();

    if (!res.ok || !data.success) {
      setError('stepCodeError', data.message || "Código inválido o expirado.");
      return;
    }

    recoverCodeValue = code;
    backTo('stepNewPassword');

  } catch (err) {
    setError('stepCodeError', "No se pudo conectar al backend (" + err.message + ")");
  }
}

async function resetPassword() {
  setError('stepNewPasswordError', '');
  const newPassword = document.getElementById('newPassword').value;
  if (!newPassword || newPassword.length < 8) {
    setError('stepNewPasswordError', 'La contraseña debe tener al menos 8 caracteres.');
    return;
  }

  try {
    const res = await fetch(`${API_URL}/auth/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: recoverCodeValue, newPassword })
    });
    const data = await res.json();

    if (!res.ok || !data.success) {
      setError('stepNewPasswordError', data.message || "No se pudo cambiar la contraseña.");
      return;
    }

    alert("¡Bien hecho! Contraseña cambiada correctamente.");
    // Reset del flujo, vuelve al login
    document.getElementById('resetCode').value = "";
    document.getElementById('newPassword').value = "";
    document.getElementById('recoverEmail').value = "";
    backTo('stepEmail');
    showTab('login');

  } catch (err) {
    setError('stepNewPasswordError', "No se pudo conectar al backend (" + err.message + ")");
  }
}
</script>

</body>
</html>
