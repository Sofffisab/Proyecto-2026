<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sesión activa</title>
<style>
  body { font-family: Arial, sans-serif; background:#f2f2f2; display:flex; justify-content:center; padding-top:40px; }
  .card { background:#fff; padding:30px; border-radius:10px; width:500px; box-shadow:0 2px 8px rgba(0,0,0,0.15); }
  h2 { margin-top:0; }
  h3 { margin-bottom:5px; color:#2d6cdf; }
  pre { background:#eee; padding:10px; border-radius:6px; white-space:pre-wrap; word-break:break-all; font-size:12px; }
  button { padding:10px 16px; margin-top:8px; margin-right:8px; border:none; border-radius:6px; background:#2d6cdf; color:#fff; cursor:pointer; font-size:14px; }
  button:hover { background:#1e54b8; }
  button.secondary { background:#888; }
  button.secondary:hover { background:#666; }
  .error { color:#c0392b; font-size:13px; margin-top:5px; }
  .ok { color:#27ae60; font-size:13px; margin-top:5px; }
  .pref-row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #eee; font-size:14px; }
  .pref-row span.label { color:#555; }
  .pref-row span.value { font-weight:bold; }
  .value.on { color:#27ae60; }
  .value.off { color:#c0392b; }
  .provisional { background:#e0a800; }
  .provisional:hover { background:#c69500; }
  input, select { width:100%; padding:8px; margin:6px 0; box-sizing:border-box; border:1px solid #ccc; border-radius:6px; }
  .hidden { display:none; }
</style>
</head>
<body>

<div class="card">
  <h2>Entraste a la sesión:</h2>

  <h3>Usuario</h3>
  <pre id="userInfo"></pre>

  <h3>Preferencias</h3>
  <div id="preferencesInfo"></div>

  <button onclick="toggleEditProfile()">Editar datos del perfil</button>
  <button class="provisional" onclick="socialInteraction()">Interacción social</button>
  <button class="provisional" onclick="leaveGym()">Me voy del gym</button>
  <button class="provisional" onclick="denuncia()">Denunciar</button>
  <button class="secondary" onclick="logout()">Cerrar sesión</button>
  <button class="secondary" onclick="felicitaciones()">felicitaciones</button>
  <button class="secondary" onclick="ayuda()">pedir ayuda</button>
  <button class="secondary" onclick="notificacion()">notificacion</button>
  <button class="secondary" onclick="rutinas()">rutinas</button>




  <div id="editProfilePanel" class="hidden">
    <h3>Editar perfil</h3>
    <input type="text" id="editFirstName" placeholder="Nombre">
    <input type="text" id="editLastName" placeholder="Apellido">
    <input type="text" id="editGender" placeholder="Género">
    <button onclick="saveProfile()">Guardar cambios</button>
    <button class="secondary" onclick="toggleEditProfile()">Cancelar</button>
    <div id="editProfileResult"></div>
  </div>

  <div id="meResult"></div>
</div>

<script>
const API_URL = "http://localhost:3000/api/v1";

function renderPreferences(settings) {
  const prefDiv = document.getElementById('preferencesInfo');

  if (!settings) {
    prefDiv.innerHTML = `<div class="error">No se pudieron cargar las preferencias.</div>`;
    return;
  }

  const rows = [
    { label: "Sin ayuda (disableAssistance)", value: settings.disableAssistance },
    { label: "Sin interacción social (disableSocial)", value: settings.disableSocial },
    { label: "Preferencia de entrenador", value: settings.trainerPreference || "—", raw: true },
    { label: "Sin escaneo de máquinas (machineTrackingOptOut)", value: settings.machineTrackingOptOut },
    { label: "Consentimiento analítico (analyticsConsent)", value: settings.analyticsConsent },
  ];

  prefDiv.innerHTML = rows.map(r => {
    if (r.raw) {
      return `<div class="pref-row"><span class="label">${r.label}</span><span class="value">${r.value}</span></div>`;
    }
    const cls = r.value ? "on" : "off";
    const text = r.value ? "Sí" : "No";
    return `<div class="pref-row"><span class="label">${r.label}</span><span class="value ${cls}">${text}</span></div>`;
  }).join("");
}

async function loadSession() {
  const accessToken = localStorage.getItem("accessToken");
  const refreshToken = localStorage.getItem("refreshToken");
  const user = localStorage.getItem("user");

  if (!accessToken || !refreshToken || !user) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById('userInfo').innerText = JSON.stringify(JSON.parse(user), null, 2);

  // Cargar datos completos (incluye preferencias/settings) desde /users/me
  await fetchMe();
}

async function fetchMe() {
  const resultDiv = document.getElementById('meResult');
  resultDiv.innerHTML = "";
  const accessToken = localStorage.getItem("accessToken");

  try {
    const res = await fetch(`${API_URL}/users/me`, {
      headers: { "Authorization": "Bearer " + accessToken }
    });
    const data = await res.json();

    if (res.ok && data.success) {
      document.getElementById('userInfo').innerText = JSON.stringify(data.data, null, 2);
      renderPreferences(data.data.settings);
      localStorage.setItem("user", JSON.stringify(data.data));
    } else {
      resultDiv.innerHTML = `<div class="error">Error (${res.status}): ${data.message || "no se pudo obtener el usuario"}</div>`;
    }
  } catch (err) {
    resultDiv.innerHTML = `<div class="error">No se pudo conectar al backend (${err.message})</div>`;
  }
}

function toggleEditProfile() {
  const panel = document.getElementById('editProfilePanel');
  panel.classList.toggle('hidden');

  if (!panel.classList.contains('hidden')) {
    const user = JSON.parse(localStorage.getItem("user") || "{}");
    document.getElementById('editFirstName').value = user.firstName || "";
    document.getElementById('editLastName').value = user.lastName || "";
    document.getElementById('editGender').value = user.gender || "";
  }
}

async function saveProfile() {
  const resultDiv = document.getElementById('editProfileResult');
  resultDiv.innerHTML = "";
  const accessToken = localStorage.getItem("accessToken");

  const body = {
    firstName: document.getElementById('editFirstName').value.trim(),
    lastName: document.getElementById('editLastName').value.trim(),
    gender: document.getElementById('editGender').value.trim(),
  };

  try {
    const res = await fetch(`${API_URL}/users/me`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + accessToken
      },
      body: JSON.stringify(body)
    });
    const data = await res.json();

    if (res.ok && data.success) {
      resultDiv.innerHTML = `<div class="ok">Perfil actualizado correctamente.</div>`;
      await fetchMe();
      toggleEditProfile();
    } else {
      resultDiv.innerHTML = `<div class="error">Error (${res.status}): ${data.message || "no se pudo actualizar el perfil"}</div>`;
    }
  } catch (err) {
    resultDiv.innerHTML = `<div class="error">No se pudo conectar al backend (${err.message})</div>`;
  }
}

// Botones provisorios/estáticos, aún sin funcionalidad conectada al backend.
function socialInteraction() {
  alert("Interacción social: funcionalidad próximamente.");
}

function leaveGym() {
  alert("Me voy del gym: funcionalidad próximamente.");
}

function denuncia() {
  alert("denunciar: funcionalidad próximamente.");
}

function felicitaciones() {
  alert("felicitaciones: funcionalidad próximamente.");
}

function ayuda() {
  alert("pedir ayuda: funcionalidad próximamente.");
}

function notificacion() {
  alert("notificacion: funcionalidad próximamente.");
}

function rutinas() {
  alert("rutinas: funcionalidad próximamente.");
}

async function logout() {
  const accessToken = localStorage.getItem("accessToken");
  try {
    await fetch(`${API_URL}/auth/logout`, {
      method: "POST",
      headers: { "Authorization": "Bearer " + accessToken }
    });
  } catch (e) {
    // ignorar errores de red al hacer logout
  }
  localStorage.removeItem("accessToken");
  localStorage.removeItem("refreshToken");
  localStorage.removeItem("user");
  window.location.href = "index.html";
}

loadSession();
</script>

</body>
</html>
